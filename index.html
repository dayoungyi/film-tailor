<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>필름 재단 배치 계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h1{margin:0 0 6px;font-size:28px}
.sub{color:#64748b;margin-bottom:18px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#64748b;font-size:13px;margin-bottom:5px}
input{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 12px;font-size:16px;background:#fff}
.rows-head,.row{display:grid;grid-template-columns:2fr 1.35fr 1.35fr 1fr 44px;gap:7px;align-items:center}
.rows-head{color:#64748b;font-size:13px;margin-bottom:5px}
.row{margin-bottom:7px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer}
.mode-buttons{display:flex;gap:10px;flex-wrap:wrap}.mode-btn{background:#eef2f7;border:2px solid #d7dee8;min-width:180px;text-align:center;line-height:1.25}.mode-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}.mode-btn small{font-size:12px;font-weight:600;opacity:.8}.btn-add{background:#eef2f7}.btn-save{background:#2456d6;color:#fff}.btn-calc{background:#0f172a;color:#fff}.btn-jpeg{background:#16803c;color:#fff}.btn-clear{background:#e9eef3}.btn-x{background:#f1f3f5;padding:9px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:#64748b;margin-top:8px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar button{padding:8px 12px;background:#fff;border:1px solid #cbd5e1}
.summary{font-weight:700;margin:10px 0}
.viewer{height:760px;overflow:auto;background:#eef2f6;border:1px solid #dce2e8;border-radius:10px;padding:24px;display:flex;justify-content:center;align-items:flex-start}
#svgHost{background:#fff;flex:none;box-shadow:0 1px 4px #0002}
.placeholder{color:#0f172a;font-weight:700;padding:25px;text-align:center}
@media(max-width:700px){
 .wrap{padding:10px}
 h1{font-size:22px}
 .grid2{grid-template-columns:1fr 1fr}
 .rows-head{display:none}
 .row{grid-template-columns:1.7fr 1fr 1fr .75fr 40px}
 .viewer{height:68vh;padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>필름 재단 배치 계산기</h1>
  <div class="sub">필름 폭과 길이를 입력하고 재단 방식을 선택하면 필름 로스를 최소화하도록 자동 배치합니다.</div>

  <div class="card">
    <div style="max-width:620px"><label>현장명</label><input id="siteName" type="text" placeholder="현장명을 입력하세요"></div>
  </div>

  <div class="card">
    <div class="grid2">
      <div><label>필름 폭 (mm)</label><input id="filmW" type="number" min="1" value="1220"></div>
      <div><label>필름 길이 (mm)</label><input id="filmL" type="number" min="1" value="50000"></div>
    </div>
  </div>

  <div class="card">
    <label>재단 배치 방식</label>
    <div class="mode-buttons" role="group" aria-label="재단 배치 방식">
      <button type="button" class="mode-btn active" id="grainMode">🌳 결 방향 우선<br><small>회전 안 함</small></button>
      <button type="button" class="mode-btn" id="solidMode">⬛ 솔리드 필름<br><small>90° 회전 허용</small></button>
    </div>
    <div class="note" id="modeNote">나뭇결·무늬 방향을 유지하여 입력한 가로 × 세로 그대로 배치합니다.</div>
  </div>

  <div class="card">
    <div class="rows-head"><div>부재명</div><div>가로(mm)</div><div>세로(mm)</div><div>수량</div><div></div></div>
    <div id="rows"></div>
    <div class="actions">
      <button class="btn-add" id="addBtn">＋ 부재 추가</button>
      <button class="btn-save" id="saveBtn">▣ 치수내역 저장</button>
    </div>
    <div class="note">가로/세로는 실제 재단할 부재 치수입니다. 위에서 선택한 재단 방식에 따라 회전 여부가 결정됩니다.</div>
  </div>

  <div class="card actions">
    <button class="btn-calc" id="calcBtn">★ 재단 배치 계산</button>
    <button class="btn-jpeg" id="jpegBtn">JPEG 이미지 저장</button>
    <button class="btn-clear" id="clearBtn">전체 삭제</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <button id="fitBtn">맞춤</button><button id="minusBtn">−</button>
      <span id="zoomText">100%</span><button id="plusBtn">＋</button>
      <span class="note">※ 50m도 세로로 길게 표시되며 스크롤해서 확인합니다.</span>
    </div>
    <div class="summary" id="summary">부재를 입력하고 배치 계산을 눌러주세요.</div>
    <div class="viewer" id="viewer"><div id="svgHost"><div class="placeholder">계산 결과가 여기에 표시됩니다.</div></div></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rowsEl = $('rows');
  let zoom = 1;
  let lastResult = null;
  let palette = ['#dceeff','#fff0c9','#dff3e5','#eee2ff','#ffe1e1','#dff1f3','#e4edff','#ffebc7','#e2f3dc','#f4ddf0'];
  const MODE_KEY='filmTailorCutMode';
  let cutMode=localStorage.getItem(MODE_KEY)==='solid' ? 'solid' : 'grain';

  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function addRow(data={name:'',w:'',h:'',qty:1}){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<input class="name" placeholder="부재명" value="${esc(data.name)}">
      <input class="w" type="number" min="1" placeholder="가로" value="${data.w}">
      <input class="h" type="number" min="1" placeholder="세로" value="${data.h}">
      <input class="qty" type="number" min="1" value="${data.qty}">
      <button class="btn-x" type="button">×</button>`;
    r.querySelector('.btn-x').onclick=()=>{r.remove(); saveLocal();};
    r.querySelectorAll('input').forEach(i=>i.addEventListener('input',saveLocal));
    rowsEl.appendChild(r);
    saveLocal();
  }
  function getItems(){
    const items=[];
    [...rowsEl.querySelectorAll('.row')].forEach((r,idx)=>{
      const name=r.querySelector('.name').value.trim() || `부재 ${idx+1}`;
      const w=+r.querySelector('.w').value, h=+r.querySelector('.h').value, qty=+r.querySelector('.qty').value;
      if(w>0&&h>0&&qty>0){
        for(let n=1;n<=qty;n++) items.push({id:items.length,name,w,h,n,qty});
      }
    });
    return items;
  }
  // Permanent storage. This key never changes between versions.
  const STORAGE_KEY='filmTailorSavedData';
  const SITE_KEY='filmTailorSiteName';
  const LEGACY_KEYS=[
    'filmTailorV12','filmTailorV11','filmTailorV10','filmTailorV9',
    'filmTailorV8','filmTailorV7','filmTailorV6','filmTailorV5',
    'filmTailorV4','filmTailorV3','filmTailor','filmTailorBackup',
    'filmTailorSavedBackup'
  ];
  let loading=false;

  function collectData(){
    return {
      version:23,
      savedAt:Date.now(),
      filmW:$('filmW').value || '1220',
      filmL:$('filmL').value || '50000',
      siteName:$('siteName').value || '',
      cutMode,
      rows:[...rowsEl.querySelectorAll('.row')].map(r=>({
        name:r.querySelector('.name').value,
        w:r.querySelector('.w').value,
        h:r.querySelector('.h').value,
        qty:r.querySelector('.qty').value
      }))
    };
  }

  function writeStorage(data){
    const raw=JSON.stringify(data);
    try{ localStorage.setItem(STORAGE_KEY,raw); }catch(e){}
    try{ localStorage.setItem('filmTailorSavedBackup',raw); }catch(e){}
    try{ localStorage.setItem(SITE_KEY, data.siteName || ''); }catch(e){}
  }

  function saveLocal(){
    if(loading) return;
    try{ writeStorage(collectData()); }catch(e){}
  }

  function readSavedData(){
    const candidates=[];
    const keys=[STORAGE_KEY,'filmTailorSavedBackup',...LEGACY_KEYS];
    const seen=new Set();

    for(const key of keys){
      if(seen.has(key)) continue;
      seen.add(key);
      try{
        const raw=localStorage.getItem(key);
        if(!raw) continue;
        const d=JSON.parse(raw);
        if(!d || !Array.isArray(d.rows)) continue;

        // Prefer the copy containing the most user-entered rows.
        // This prevents a newly-created default row from replacing
        // an older 30~40-row measurement list.
        const validRows=d.rows.filter(x =>
          x && (String(x.name||'').trim() || Number(x.w)>0 || Number(x.h)>0)
        );
        candidates.push({
          ...d,
          rows:d.rows,
          _rowCount:validRows.length,
          _savedAt:Number(d.savedAt)||0
        });
      }catch(e){}
    }

    if(!candidates.length) return null;
    candidates.sort((a,b)=>
      b._rowCount-a._rowCount || b._savedAt-a._savedAt
    );
    return candidates[0];
  }

  function makeSavedRow(x){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<input class="name" placeholder="부재명" value="${esc(x.name||'')}">
      <input class="w" type="number" min="1" placeholder="가로" value="${x.w||''}">
      <input class="h" type="number" min="1" placeholder="세로" value="${x.h||''}">
      <input class="qty" type="number" min="1" value="${x.qty||1}">
      <button class="btn-x" type="button">×</button>`;
    r.querySelector('.btn-x').onclick=()=>{r.remove();saveLocal();};
    r.querySelectorAll('input').forEach(i=>i.addEventListener('input',saveLocal));
    return r;
  }

  function loadLocal(){
    loading=true;
    const d=readSavedData();
    rowsEl.innerHTML='';

    if(d){
      $('filmW').value=d.filmW||1220;
      $('filmL').value=d.filmL||50000;
      $('siteName').value=d.siteName||localStorage.getItem(SITE_KEY)||'';
      if(d.cutMode==='solid'||d.cutMode==='grain') cutMode=d.cutMode;
      d.rows.forEach(x=>rowsEl.appendChild(makeSavedRow(x)));

      loading=false;
      // Migrate the best existing copy to the permanent key.
      writeStorage(collectData());
      return;
    }

    $('filmW').value='1220';
    $('filmL').value='50000';
    $('siteName').value=localStorage.getItem(SITE_KEY)||'';
    rowsEl.appendChild(makeSavedRow({name:'문짝',w:850,h:2000,qty:1}));
    loading=false;
    saveLocal();
  }


  // 로스 최소화를 최우선으로 하면서, 같은 품목은 가능한 한 연속해서
  // 보이도록 배치합니다. "품목 묶기"가 로스를 악화시키는 경우에는
  // 묶음보다 필름 활용을 우선합니다.
  // 2D 빔서치 기반 배치:
  // - 로스(사용 길이)를 1순위로 최소화
  // - 같은 품목 연속성은 로스가 비슷할 때만 우선
  // - 폭이 넓은 부재를 우선 후보로 삼되, 남는 폭을 채울 수 있는
  //   좁고 긴 부재도 중간에 적극적으로 끼워 넣음
  // - 결 방향 모드에서는 회전 금지, 솔리드에서는 90° 회전 허용
  function pack(items, filmW, filmL, allowRotation=false){
    const keyOf=i=>`${i.name}\u0000${i.w}\u0000${i.h}`;

    function intersects(a,b){
      return !(a.x>=b.x+b.w || a.x+a.w<=b.x || a.y>=b.y+b.h || a.y+a.h<=b.y);
    }
    function contains(a,b){
      return a.x<=b.x && a.y<=b.y && a.x+a.w>=b.x+b.w && a.y+a.h>=b.y+b.h;
    }
    function prune(rects){
      const out=[];
      for(let i=0;i<rects.length;i++){
        const r=rects[i]; if(r.w<=0.01||r.h<=0.01) continue;
        let covered=false;
        for(let j=0;j<rects.length;j++){
          if(i!==j && contains(rects[j],r)){covered=true;break;}
        }
        if(!covered) out.push(r);
      }
      const seen=new Set();
      return out.filter(r=>{
        const k=`${r.x}|${r.y}|${r.w}|${r.h}`;
        if(seen.has(k)) return false;
        seen.add(k); return true;
      });
    }
    function place(free, chosen){
      const next=[];
      for(const fr of free){
        if(!intersects(chosen,fr)){next.push(fr);continue;}
        if(chosen.x>fr.x) next.push({x:fr.x,y:fr.y,w:chosen.x-fr.x,h:fr.h});
        if(chosen.x+chosen.w<fr.x+fr.w)
          next.push({x:chosen.x+chosen.w,y:fr.y,w:fr.x+fr.w-(chosen.x+chosen.w),h:fr.h});
        if(chosen.y>fr.y) next.push({x:fr.x,y:fr.y,w:fr.w,h:chosen.y-fr.y});
        if(chosen.y+chosen.h<fr.y+fr.h)
          next.push({x:fr.x,y:chosen.y+chosen.h,w:fr.w,h:fr.y+fr.h-(chosen.y+chosen.h)});
      }
      return prune(next);
    }

    const orientations=(it)=>{
      const a=[[it.w,it.h,0]];
      if(allowRotation && it.w!==it.h) a.push([it.h,it.w,90]);
      return a;
    };

    // 한 품목을 특정 자유영역에 넣었을 때의 좋은 후보 위치를 반환합니다.
    function placementCandidates(state,it,limit=4){
      const out=[];
      for(const fr of state.free){
        for(const [pw,ph,rot] of orientations(it)){
          if(pw>fr.w || ph>fr.h) continue;
          const x=fr.x, y=fr.y;
          const newMaxY=Math.max(state.maxY,y+ph);
          const leftoverArea=fr.w*fr.h-pw*ph;
          const splitWaste=Math.min(Math.max(0,fr.w-pw),Math.max(0,fr.h-ph));
          // 아래/오른쪽으로 이어지는 빈 공간을 남기는 것을 약간 선호
          const edgeFit=Math.min(fr.w-pw,fr.h-ph);
          const same=state.prevKey!==null && keyOf(it)===state.prevKey;
          const local=[newMaxY,leftoverArea,splitWaste,same?0:1,fr.y,fr.x];
          out.push({x,y,w:pw,h:ph,rot,local});
        }
      }
      out.sort((a,b)=>{
        for(let i=0;i<a.local.length;i++) if(a.local[i]!==b.local[i]) return a.local[i]-b.local[i];
        return 0;
      });
      return out.slice(0,limit);
    }

    // 빔서치가 한 단계에서 모든 부재를 보게 하되, 계산량을 제한하기 위해
    // 폭/길이/면적 상위 후보 + 직전 품목을 우선적으로 탐색합니다.
    function candidateIds(state){
      const ids=state.remaining;
      const prev=state.prevKey;
      const scored=ids.map(id=>{
        const it=items[id];
        const same=prev && keyOf(it)===prev ? 1:0;
        const fillable=state.free.reduce((best,fr)=>{
          const fits=orientations(it).some(([w,h])=>w<=fr.w&&h<=fr.h);
          if(!fits) return best;
          return Math.max(best,Math.min(fr.w-it.w,fr.h-it.h));
        },-1);
        return {id,it,same,fillable};
      });
      scored.sort((a,b)=>{
        if(a.same!==b.same) return b.same-a.same;
        if(a.fillable!==b.fillable) return a.fillable-b.fillable;
        if(a.it.w!==b.it.w) return b.it.w-a.it.w;
        if(a.it.h!==b.it.h) return b.it.h-a.it.h;
        return b.it.w*b.it.h-a.it.w*a.it.h;
      });
      // 넓은 품목과 좁고 긴 품목이 모두 후보에 들어오게 합니다.
      const extra=[...ids].sort((a,b)=>items[b].h-items[a].h);
      const extra2=[...ids].sort((a,b)=>items[b].w*items[b].h-items[a].w*items[a].h);
      const picked=[];
      for(const arr of [scored.map(x=>x.id),extra,extra2]){
        for(const id of arr){ if(!picked.includes(id)) picked.push(id); if(picked.length>=18) break; }
        if(picked.length>=18) break;
      }
      return picked;
    }

    const initial={
      free:[{x:0,y:0,w:filmW,h:filmL}],
      placed:[],
      remaining:items.map((_,i)=>i),
      maxY:0,
      prevKey:null,
      breaks:0,
      area:0
    };

    // beamWidth를 넓게 잡아 '같은 품목 묶기' 때문에 좋은 배치가 사라지는 것을 방지합니다.
    let beam=[initial];
    const beamWidth=28;

    for(let step=0;step<items.length;step++){
      const next=[];
      for(const state of beam){
        for(const id of candidateIds(state)){
          const it=items[id];
          const pcs=placementCandidates(state,it,4);
          for(const chosen of pcs){
            const placedItem={...it,...chosen};
            const newFree=place(state.free,chosen);
            const rem=state.remaining.filter(x=>x!==id);
            const k=keyOf(it);
            const br=state.breaks + (state.prevKey!==null && state.prevKey!==k ? 1:0);
            const newMaxY=Math.max(state.maxY,chosen.y+chosen.h);
            next.push({
              free:newFree,
              placed:state.placed.concat(placedItem),
              remaining:rem,
              maxY:newMaxY,
              prevKey:k,
              breaks:br,
              area:state.area+it.w*it.h
            });
          }
        }
      }
      if(!next.length) return null;

      // 길이를 가장 강하게 줄이되, 같은 길이에서는 자유공간 파편화를 줄이고
      // 같은 품목의 연속성을 보조적으로 고려합니다.
      next.sort((a,b)=>{
        const aFree=a.free.reduce((s,r)=>s+r.w*r.h,0);
        const bFree=b.free.reduce((s,r)=>s+r.w*r.h,0);
        const aSmall=a.free.reduce((s,r)=>s+Math.min(r.w,r.h),0);
        const bSmall=b.free.reduce((s,r)=>s+Math.min(r.w,r.h),0);
        const av=a.maxY*1000000 + (filmW*filmL-aFree)*0.01 + aSmall*0.001 + a.breaks*0.1;
        const bv=b.maxY*1000000 + (filmW*filmL-bFree)*0.01 + bSmall*0.001 + b.breaks*0.1;
        return av-bv;
      });
      beam=next.slice(0,beamWidth);
    }

    let best=null;
    for(const state of beam){
      if(state.maxY>filmL) continue;
      const used=state.maxY;
      const area=state.area;
      const wasteArea=Math.max(0,used*filmW-area);
      // 로스가 절대적인 1순위. 차이가 100mm 이내일 때만 품목 연속성을 고려합니다.
      if(!best || used<best.maxY-100 ||
        (Math.abs(used-best.maxY)<=100 && (wasteArea<best.wasteArea-1 ||
         (Math.abs(wasteArea-best.wasteArea)<=1 && state.breaks<best.breaks)))){
        best={placed:state.placed,maxY:used,area,wasteArea,breaks:state.breaks};
      }
    }
    return best;
  }

  function sizeText(text, maxW, base, min){
    // Estimate width conservatively; do not horizontally squash text.
    let size=base;
    const estimate=t=>[...t].reduce((n,ch)=>n+(ch.charCodeAt(0)>255?1:0.55),0)*size;
    while(size>min && estimate(text)>maxW) size-=0.5;
    return Math.max(min,size);
  }

  function render(result, filmW, filmL){
    const used=Math.ceil(result.maxY);
    // Always draw the ENTIRE roll length, not just the used portion.
    // This makes the remaining 50m roll area visible at a glance.
    const scale=0.55; // screen-friendly mm->px base
    const topH=64;
    // 화면 좌표를 실제 px 기준으로 통일합니다.
    // 필름은 좌우 여백이 같도록 가운데 배치하고, 요약 정보는 우측 상단에 둡니다.
    const rollW=filmW*scale;
    const sideW=130;
    const filmX=sideW/2;
    const svgW=rollW+sideW;
    const rollH=Math.max(filmL,used,1)*scale;
    const pxW=svgW, pxH=topH+rollH;

    const colors=new Map();
    let ci=0;
    const keyOf=p=>`${Math.min(p.w,p.h)}x${Math.max(p.w,p.h)}`;
    let body='';

    // Full-roll outline + used/remaining guides.
    const usedY=topH+used*scale;
    const totalY=topH+filmL*scale;
    const remain=Math.max(0,filmL-used);

    body += `<rect x="0" y="${topH}" width="${rollW.toFixed(2)}" height="${rollH.toFixed(2)}"
                    fill="#fff" stroke="#222" stroke-width="2"/>`;

    for(const p of result.placed){
      const key=keyOf(p);
      if(!colors.has(key)) colors.set(key,palette[ci++%palette.length]);
      const fill=colors.get(key);
      const x=p.x*scale, y=topH+p.y*scale, w=p.w*scale, h=p.h*scale;
      const cx=x+w/2, cy=y+h/2;
      const dim=`${Math.round(Math.min(p.w,p.h))} × ${Math.round(Math.max(p.w,p.h))}`;
      const nameSize=sizeText(p.name,Math.max(24,w-14),Math.min(30,Math.max(12,w/9)),8);
      const dimSize=sizeText(dim,Math.max(28,w-14),Math.min(27,Math.max(11,w/10)),7);
      let nameY=cy-5, dimY=cy+Math.min(24,h*.14);
      if(h<70){nameY=cy-8;dimY=cy+12}
      body+=`<g><rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${fill}" stroke="#222" stroke-width="1"/>
        <text x="${cx.toFixed(2)}" y="${nameY.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="${nameSize}px">${esc(p.name)}</text>
        <text x="${cx.toFixed(2)}" y="${dimY.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" font-size="${dimSize}px">${dim}</text></g>`;
    }

    // Boundary of the actual material used and the unused tail.
    body += `<line x1="0" y1="${usedY.toFixed(2)}" x2="${rollW.toFixed(2)}" y2="${usedY.toFixed(2)}"
                    stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>`;

    const svg=`<svg id="resultSvg" xmlns="http://www.w3.org/2000/svg" width="${pxW}" height="${pxH}" viewBox="0 0 ${pxW} ${pxH}">
      <rect width="100%" height="100%" fill="#fff"/>
      <text x="${(filmX+rollW/2).toFixed(2)}" y="25" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700">${esc($('siteName').value.trim())}</text>
      <text x="${(filmX+rollW/2).toFixed(2)}" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700">필름 폭 ${filmW.toLocaleString()} mm</text>
      <line x1="${filmX+20}" y1="58" x2="${Math.max(filmX+20,filmX+rollW-20)}" y2="58" stroke="#444"/>
      <g transform="translate(${filmX},0)">${body}</g>

      <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
        <text x="${svgW-10}" y="18" text-anchor="end" font-size="14" font-weight="700">전체 ${filmL.toLocaleString()} mm</text>
        <text x="${svgW-10}" y="38" text-anchor="end" font-size="14" font-weight="700" fill="#15803d">사용 ${used.toLocaleString()} mm</text>
        <text x="${svgW-10}" y="58" text-anchor="end" font-size="14" font-weight="700" fill="#d97706">남음 ${remain.toLocaleString()} mm</text>
        <text x="${(filmX+rollW/2).toFixed(2)}" y="${Math.max(topH+30,usedY-8)}" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">재단 끝 (${used.toLocaleString()} mm)</text>
        <text x="${(filmX+rollW/2).toFixed(2)}" y="${Math.min(totalY-8, usedY+26)}" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">남은 필름 ${remain.toLocaleString()} mm</text>
        <text x="${(filmX+rollW/2).toFixed(2)}" y="${totalY+22}" text-anchor="middle" font-size="13" fill="#475569">필름 끝 · ${filmW.toLocaleString()} × ${filmL.toLocaleString()} mm</text>
      </g>
    </svg>`;

    $('svgHost').innerHTML=svg;
    $('svgHost').style.width=pxW+'px';
    $('svgHost').style.height=(pxH+4)+'px';
    lastResult={svg:document.getElementById('resultSvg'),used,filmW,filmL,result};
  }

  function calculate(){
    saveLocal();
    const filmW=+$('filmW').value, filmL=+$('filmL').value, items=getItems();
    if(!(filmW>0&&filmL>0)){alert('필름 폭과 길이를 입력해주세요.');return;}
    if(!items.length){alert('부재를 하나 이상 입력해주세요.');return;}
    const allowRotation = cutMode==='solid';
    const impossible=items.find(i=>allowRotation ? Math.min(i.w,i.h)>filmW : i.w>filmW);
    if(impossible){
      const msg = allowRotation
        ? `필름 폭 ${filmW}mm에 들어가지 않는 부재가 있습니다: ${impossible.name} (${impossible.w}×${impossible.h})`
        : `결 방향 우선에서는 부재의 가로 폭이 필름 폭을 넘을 수 없습니다: ${impossible.name} (${impossible.w}×${impossible.h})`;
      alert(msg);return;
    }
    const result=pack(items,filmW,filmL,allowRotation);
    if(!result){alert('배치 계산에 실패했습니다.');return;}
    const used=result.maxY, remain=Math.max(0,filmL-used);
    const materialArea=used*filmW;
    const partArea=result.area;
    const util=materialArea?partArea/materialArea*100:0;
    const waste=100-util;
    $('summary').textContent=`필름: ${filmW.toLocaleString()} × ${filmL.toLocaleString()} mm | 사용 길이: ${Math.ceil(used).toLocaleString()} mm | 남은 길이: ${Math.max(0,Math.floor(remain)).toLocaleString()} mm | 부재 ${items.length}개 | ${allowRotation?'솔리드 · 90° 회전 허용':'결 방향 우선 · 회전 안 함'} | 재단면적 활용률: ${util.toFixed(1)}% | 배치 로스: ${waste.toFixed(1)}%`;
    render(result,filmW,filmL);
    lastResult=lastResult||{};
    lastResult.items=items;
  }

  function saveCSV(){
    const rows=[...rowsEl.querySelectorAll('.row')];
    const lines=[['부재명','가로(mm)','세로(mm)','수량'].join(',')];
    rows.forEach(r=>{
      const vals=[r.querySelector('.name').value,r.querySelector('.w').value,r.querySelector('.h').value,r.querySelector('.qty').value];
      lines.push(vals.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    });
    const blob=new Blob(["\ufeff"+lines.join('\\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='필름_재단_치수내역.csv';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  async function saveJPEG(){
    if(!lastResult||!lastResult.svg){alert('먼저 재단 배치를 계산해주세요.');return;}

    const src=lastResult.svg;
    const siteName=$('siteName').value.trim() || '현장명 미입력';
    const used=lastResult.used;

    // 화면에 보이는 재단 배치 SVG를 그대로 사용합니다.
    // 따라서 현장명/필름 폭/전체·사용·남음/필름 중앙정렬이
    // 웹 화면과 JPEG에서 완전히 동일하게 유지됩니다.
    const srcW=Number(src.getAttribute('width'))||src.viewBox.baseVal.width;
    const srcH=Number(src.getAttribute('height'))||src.viewBox.baseVal.height;

    // 마지막 재단선 아래에 안내 문구가 들어갈 약간의 여백만 남기고
    // 50m 전체의 빈 필름 부분은 JPEG에서 잘라냅니다.
    const scale=0.55;
    const topH=64;
    const bottomMargin=42;
    const cropH=Math.min(srcH, topH + used*scale + bottomMargin);

    const clone=src.cloneNode(true);
    clone.setAttribute('width', srcW);
    clone.setAttribute('height', cropH);
    clone.setAttribute('viewBox', `0 0 ${srcW} ${cropH}`);

    // 흰 배경을 포함한 동일한 재단 배치 이미지를 JPEG로 변환합니다.
    const svgText=new XMLSerializer().serializeToString(clone);
    const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();

    img.onload=()=>{
      // 고해상도 JPEG
      const c=document.createElement('canvas');
      const exportScale=2;
      c.width=Math.max(1,Math.round(srcW*exportScale));
      c.height=Math.max(1,Math.round(cropH*exportScale));

      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);

      c.toBlob(b=>{
        if(!b){
          URL.revokeObjectURL(url);
          alert('JPEG 저장 중 오류가 발생했습니다.');
          return;
        }

        const outUrl=URL.createObjectURL(b);
        const a=document.createElement('a');
        a.href=outUrl;
        a.download=`${siteName}_재단배치.jpg`;
        a.click();

        setTimeout(()=>{
          URL.revokeObjectURL(url);
          URL.revokeObjectURL(outUrl);
        },1500);
      },'image/jpeg',0.95);
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      alert('JPEG 변환 중 오류가 발생했습니다.');
    };

    img.src=url;
  }

  function clearAll(){
    if(!confirm('입력한 부재와 필름 정보를 모두 삭제할까요?'))return;
    [STORAGE_KEY,'filmTailorSavedBackup',SITE_KEY,MODE_KEY,...LEGACY_KEYS].forEach(k=>localStorage.removeItem(k));
    cutMode='grain';
    rowsEl.innerHTML='';$('siteName').value='';$('summary').textContent='부재를 입력하고 배치 계산을 눌러주세요.';$('svgHost').innerHTML='<div class="placeholder">계산 결과가 여기에 표시됩니다.</div>';lastResult=null;
  }

  $('addBtn').onclick=()=>addRow();
  $('saveBtn').onclick=saveCSV;
  $('calcBtn').onclick=calculate;
  $('jpegBtn').onclick=saveJPEG;
  $('clearBtn').onclick=clearAll;
  $('filmW').addEventListener('input',saveLocal);
  $('filmL').addEventListener('input',saveLocal);
  $('siteName').addEventListener('input',()=>{localStorage.setItem(SITE_KEY,$('siteName').value);saveLocal();});
  window.addEventListener('beforeunload',saveLocal);
  window.addEventListener('pagehide',saveLocal);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveLocal();});
  $('minusBtn').onclick=()=>{zoom=Math.max(.5,zoom-.1);applyZoom()};
  $('plusBtn').onclick=()=>{zoom=Math.min(2,zoom+.1);applyZoom()};
  $('fitBtn').onclick=()=>{zoom=1;applyZoom()};
  function applyZoom(){ $('zoomText').textContent=Math.round(zoom*100)+'%'; $('svgHost').style.transform=`scale(${zoom})`; $('svgHost').style.transformOrigin='top center'; }


  function updateModeUI(){
    const grain=cutMode==='grain';
    $('grainMode').classList.toggle('active',grain);
    $('solidMode').classList.toggle('active',!grain);
    $('modeNote').textContent=grain
      ? '나뭇결·무늬 방향을 유지하여 입력한 가로 × 세로 그대로 배치합니다.'
      : '솔리드 필름이므로 필요하면 90° 회전하여 필름 로스를 줄입니다.';
  }
  function setCutMode(mode){
    cutMode=mode==='solid'?'solid':'grain';
    localStorage.setItem(MODE_KEY,cutMode);
    saveLocal();
    updateModeUI();
  }
  $('grainMode').onclick=()=>setCutMode('grain');
  $('solidMode').onclick=()=>setCutMode('solid');
  updateModeUI();
  loadLocal();
  updateModeUI();
})();
</script>
