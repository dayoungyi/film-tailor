<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>필름 재단 배치 계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h1{margin:0 0 6px;font-size:28px}
.sub{color:#64748b;margin-bottom:18px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#64748b;font-size:13px;margin-bottom:5px}
input{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 12px;font-size:16px;background:#fff}
.rows-head,.row{display:grid;grid-template-columns:2fr 1.35fr 1.35fr 1fr 44px;gap:7px;align-items:center}
.rows-head{color:#64748b;font-size:13px;margin-bottom:5px}
.row{margin-bottom:7px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer}
.btn-add{background:#eef2f7}.btn-save{background:#2456d6;color:#fff}.btn-calc{background:#0f172a;color:#fff}.btn-jpeg{background:#16803c;color:#fff}.btn-clear{background:#e9eef3}.btn-x{background:#f1f3f5;padding:9px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:#64748b;margin-top:8px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar button{padding:8px 12px;background:#fff;border:1px solid #cbd5e1}
.summary{font-weight:700;margin:10px 0}
.viewer{height:760px;overflow:auto;background:#eef2f6;border:1px solid #dce2e8;border-radius:10px;padding:24px;display:flex;justify-content:center;align-items:flex-start}
#svgHost{background:#fff;flex:none;box-shadow:0 1px 4px #0002}
.placeholder{color:#0f172a;font-weight:700;padding:25px;text-align:center}
@media(max-width:700px){
 .wrap{padding:10px}
 h1{font-size:22px}
 .grid2{grid-template-columns:1fr 1fr}
 .rows-head{display:none}
 .row{grid-template-columns:1.7fr 1fr 1fr .75fr 40px}
 .viewer{height:68vh;padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>필름 재단 배치 계산기</h1>
  <div class="sub">필름 폭과 길이를 입력하고 부재를 입력하면 필름 로스를 최소화하도록 자동 배치합니다.</div>

  <div class="card">
    <div style="max-width:620px"><label>현장명</label><input id="siteName" type="text" placeholder="현장명을 입력하세요"></div>
  </div>

  <div class="card">
    <div class="grid2">
      <div><label>필름 폭 (mm)</label><input id="filmW" type="number" min="1" value="1220"></div>
      <div><label>필름 길이 (mm)</label><input id="filmL" type="number" min="1" value="50000"></div>
    </div>
  </div>

  <div class="card">
    <div class="rows-head"><div>부재명</div><div>가로(mm)</div><div>세로(mm)</div><div>수량</div><div></div></div>
    <div id="rows"></div>
    <div class="actions">
      <button class="btn-add" id="addBtn">＋ 부재 추가</button>
      <button class="btn-save" id="saveBtn">▣ 치수내역 저장</button>
    </div>
    <div class="note">가로/세로는 실제 재단할 부재 치수입니다. 부재는 90도 회전해서 배치할 수 있습니다.</div>
  </div>

  <div class="card actions">
    <button class="btn-calc" id="calcBtn">★ 재단 배치 계산</button>
    <button class="btn-jpeg" id="jpegBtn">JPEG 이미지 저장</button>
    <button class="btn-clear" id="clearBtn">전체 삭제</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <button id="fitBtn">맞춤</button><button id="minusBtn">−</button>
      <span id="zoomText">100%</span><button id="plusBtn">＋</button>
      <span class="note">※ 50m도 세로로 길게 표시되며 스크롤해서 확인합니다.</span>
    </div>
    <div class="summary" id="summary">부재를 입력하고 배치 계산을 눌러주세요.</div>
    <div class="viewer" id="viewer"><div id="svgHost"><div class="placeholder">계산 결과가 여기에 표시됩니다.</div></div></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rowsEl = $('rows');
  let zoom = 1;
  let lastResult = null;
  let palette = ['#dceeff','#fff0c9','#dff3e5','#eee2ff','#ffe1e1','#dff1f3','#e4edff','#ffebc7','#e2f3dc','#f4ddf0'];

  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function addRow(data={name:'',w:'',h:'',qty:1}){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<input class="name" placeholder="부재명" value="${esc(data.name)}">
      <input class="w" type="number" min="1" placeholder="가로" value="${data.w}">
      <input class="h" type="number" min="1" placeholder="세로" value="${data.h}">
      <input class="qty" type="number" min="1" value="${data.qty}">
      <button class="btn-x" type="button">×</button>`;
    r.querySelector('.btn-x').onclick=()=>{r.remove(); saveLocal();};
    r.querySelectorAll('input').forEach(i=>i.addEventListener('input',saveLocal));
    rowsEl.appendChild(r);
    saveLocal();
  }
  function getItems(){
    const items=[];
    [...rowsEl.querySelectorAll('.row')].forEach((r,idx)=>{
      const name=r.querySelector('.name').value.trim() || `부재 ${idx+1}`;
      const w=+r.querySelector('.w').value, h=+r.querySelector('.h').value, qty=+r.querySelector('.qty').value;
      if(w>0&&h>0&&qty>0){
        for(let n=1;n<=qty;n++) items.push({id:items.length,name,w,h,n,qty});
      }
    });
    return items;
  }
  // Permanent storage. This key never changes between versions.
  const STORAGE_KEY='filmTailorSavedData';
  const SITE_KEY='filmTailorSiteName';
  const LEGACY_KEYS=[
    'filmTailorV12','filmTailorV11','filmTailorV10','filmTailorV9',
    'filmTailorV8','filmTailorV7','filmTailorV6','filmTailorV5',
    'filmTailorV4','filmTailorV3','filmTailor','filmTailorBackup',
    'filmTailorSavedBackup'
  ];
  let loading=false;

  function collectData(){
    return {
      version:16,
      savedAt:Date.now(),
      filmW:$('filmW').value || '1220',
      filmL:$('filmL').value || '50000',
      siteName:$('siteName').value || '',
      rows:[...rowsEl.querySelectorAll('.row')].map(r=>({
        name:r.querySelector('.name').value,
        w:r.querySelector('.w').value,
        h:r.querySelector('.h').value,
        qty:r.querySelector('.qty').value
      }))
    };
  }

  function writeStorage(data){
    const raw=JSON.stringify(data);
    try{ localStorage.setItem(STORAGE_KEY,raw); }catch(e){}
    try{ localStorage.setItem('filmTailorSavedBackup',raw); }catch(e){}
    try{ localStorage.setItem(SITE_KEY, data.siteName || ''); }catch(e){}
  }

  function saveLocal(){
    if(loading) return;
    try{ writeStorage(collectData()); }catch(e){}
  }

  function readSavedData(){
    const candidates=[];
    const keys=[STORAGE_KEY,'filmTailorSavedBackup',...LEGACY_KEYS];
    const seen=new Set();

    for(const key of keys){
      if(seen.has(key)) continue;
      seen.add(key);
      try{
        const raw=localStorage.getItem(key);
        if(!raw) continue;
        const d=JSON.parse(raw);
        if(!d || !Array.isArray(d.rows)) continue;

        // Prefer the copy containing the most user-entered rows.
        // This prevents a newly-created default row from replacing
        // an older 30~40-row measurement list.
        const validRows=d.rows.filter(x =>
          x && (String(x.name||'').trim() || Number(x.w)>0 || Number(x.h)>0)
        );
        candidates.push({
          ...d,
          rows:d.rows,
          _rowCount:validRows.length,
          _savedAt:Number(d.savedAt)||0
        });
      }catch(e){}
    }

    if(!candidates.length) return null;
    candidates.sort((a,b)=>
      b._rowCount-a._rowCount || b._savedAt-a._savedAt
    );
    return candidates[0];
  }

  function makeSavedRow(x){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<input class="name" placeholder="부재명" value="${esc(x.name||'')}">
      <input class="w" type="number" min="1" placeholder="가로" value="${x.w||''}">
      <input class="h" type="number" min="1" placeholder="세로" value="${x.h||''}">
      <input class="qty" type="number" min="1" value="${x.qty||1}">
      <button class="btn-x" type="button">×</button>`;
    r.querySelector('.btn-x').onclick=()=>{r.remove();saveLocal();};
    r.querySelectorAll('input').forEach(i=>i.addEventListener('input',saveLocal));
    return r;
  }

  function loadLocal(){
    loading=true;
    const d=readSavedData();
    rowsEl.innerHTML='';

    if(d){
      $('filmW').value=d.filmW||1220;
      $('filmL').value=d.filmL||50000;
      $('siteName').value=d.siteName||localStorage.getItem(SITE_KEY)||'';
      d.rows.forEach(x=>rowsEl.appendChild(makeSavedRow(x)));

      loading=false;
      // Migrate the best existing copy to the permanent key.
      writeStorage(collectData());
      return;
    }

    $('filmW').value='1220';
    $('filmL').value='50000';
    $('siteName').value=localStorage.getItem(SITE_KEY)||'';
    rowsEl.appendChild(makeSavedRow({name:'문짝',w:850,h:2000,qty:1}));
    loading=false;
    saveLocal();
  }


  // MaxRects-like heuristic: keep free rectangles and choose the placement
  // that minimizes resulting short-axis waste, then long-axis waste.
  function pack(items, filmW, filmL){
    // Robust finite-bin MaxRects heuristic.
    // Using the actual 50m film length as the initial bin prevents
    // Infinity-related free-space bugs and guarantees placements stay
    // inside the available roll length.
    const base=[...items];
    const orders=[];
    const area=i=>i.w*i.h;
    const dims=i=>Math.max(i.w,i.h);
    const minDim=i=>Math.min(i.w,i.h);

    const makeOrder=(arr,cmp)=>[...arr].sort(cmp);
    orders.push(makeOrder(base,(a,b)=>area(b)-area(a)));
    orders.push(makeOrder(base,(a,b)=>dims(b)-dims(a)));
    orders.push(makeOrder(base,(a,b)=>minDim(b)-minDim(a)));
    orders.push(makeOrder(base,(a,b)=>(b.w+b.h)-(a.w+a.h)));
    orders.push(makeOrder(base,(a,b)=>b.h-a.h || b.w-a.w));
    orders.push(makeOrder(base,(a,b)=>b.w-a.w || b.h-a.h));

    // Deterministic variants give the heuristic more chances to find
    // tighter combinations without making the browser hang.
    for(let k=0;k<10;k++){
      const arr=[...base];
      let seed=12345+k*97;
      arr.sort(()=>{
        seed=(seed*1664525+1013904223)>>>0;
        return (seed/4294967296)-0.5;
      });
      orders.push(arr);
    }

    function intersects(a,b){
      return !(a.x>=b.x+b.w || a.x+a.w<=b.x ||
               a.y>=b.y+b.h || a.y+a.h<=b.y);
    }

    function prune(rects){
      const out=[];
      for(let i=0;i<rects.length;i++){
        const r=rects[i];
        if(r.w<=0||r.h<=0) continue;
        let contained=false;
        for(let j=0;j<rects.length;j++){
          if(i===j) continue;
          const q=rects[j];
          if(r.x>=q.x && r.y>=q.y &&
             r.x+r.w<=q.x+q.w && r.y+r.h<=q.y+q.h){
            contained=true; break;
          }
        }
        if(!contained) out.push(r);
      }
      return out;
    }

    let best=null;

    for(const order of orders){
      let free=[{x:0,y:0,w:filmW,h:filmL}];
      const placed=[];
      let failed=false;

      for(const it of order){
        let chosen=null;

        const orientations = it.w===it.h
          ? [[it.w,it.h,0]]
          : [[it.w,it.h,0],[it.h,it.w,1]];

        for(const fr of free){
          for(const [pw,ph,rot] of orientations){
            if(pw>fr.w || ph>fr.h) continue;

            const leftoverW=fr.w-pw;
            const leftoverH=fr.h-ph;
            // Best short-side fit first; then long-side fit.
            const score=[
              Math.min(leftoverW,leftoverH),
              Math.max(leftoverW,leftoverH),
              fr.y,
              fr.x
            ];

            if(!chosen || score[0]<chosen.score[0] ||
              (score[0]===chosen.score[0] && score[1]<chosen.score[1]) ||
              (score[0]===chosen.score[0] && score[1]===chosen.score[1] &&
               (score[2]<chosen.score[2] ||
                (score[2]===chosen.score[2]&&score[3]<chosen.score[3])))){
              chosen={x:fr.x,y:fr.y,w:pw,h:ph,rot,score};
            }
          }
        }

        if(!chosen){ failed=true; break; }

        placed.push({...it,...chosen});

        const newFree=[];
        for(const fr of free){
          if(!intersects(chosen,fr)){
            newFree.push(fr);
            continue;
          }

          // Split around the placed rectangle into up to four rectangles.
          if(chosen.x>fr.x)
            newFree.push({x:fr.x,y:fr.y,w:chosen.x-fr.x,h:fr.h});
          if(chosen.x+chosen.w<fr.x+fr.w)
            newFree.push({
              x:chosen.x+chosen.w,y:fr.y,
              w:fr.x+fr.w-(chosen.x+chosen.w),h:fr.h
            });
          if(chosen.y>fr.y)
            newFree.push({x:fr.x,y:fr.y,w:fr.w,h:chosen.y-fr.y});
          if(chosen.y+chosen.h<fr.y+fr.h)
            newFree.push({
              x:fr.x,y:chosen.y+chosen.h,
              w:fr.w,h:fr.y+fr.h-(chosen.y+chosen.h)
            });
        }

        free=prune(newFree);
      }

      if(failed) continue;

      const used=placed.reduce((m,p)=>Math.max(m,p.y+p.h),0);
      const partArea=placed.reduce((s,p)=>s+p.w*p.h,0);
      const wasteArea=Math.max(0,used*filmW-partArea);

      // Primary objective: shortest used film length.
      // Secondary: least unused area within the used length.
      const score=used*1e9+wasteArea;

      if(!best || score<best.score){
        best={placed,maxY:used,area:partArea,score};
      }
    }

    return best;
  }

  function sizeText(text, maxW, base, min){
    // Estimate width conservatively; do not horizontally squash text.
    let size=base;
    const estimate=t=>[...t].reduce((n,ch)=>n+(ch.charCodeAt(0)>255?1:0.55),0)*size;
    while(size>min && estimate(text)>maxW) size-=0.5;
    return Math.max(min,size);
  }

  function render(result, filmW, filmL){
    const used=Math.ceil(result.maxY);
    // Always draw the ENTIRE roll length, not just the used portion.
    // This makes the remaining 50m roll area visible at a glance.
    const scale=0.55; // screen-friendly mm->px base
    const topH=64;
    const sideW=170;
    const svgW=filmW+sideW;
    const rollH=Math.max(filmL,used,1)*scale;
    const pxW=svgW*scale, pxH=topH+rollH;

    const colors=new Map();
    let ci=0;
    const keyOf=p=>`${Math.min(p.w,p.h)}x${Math.max(p.w,p.h)}`;
    let body='';

    // Full-roll outline + used/remaining guides.
    const rollW=filmW*scale;
    const usedY=topH+used*scale;
    const totalY=topH+filmL*scale;
    const remain=Math.max(0,filmL-used);

    body += `<rect x="0" y="${topH}" width="${rollW.toFixed(2)}" height="${rollH.toFixed(2)}"
                    fill="#fff" stroke="#222" stroke-width="2"/>`;

    for(const p of result.placed){
      const key=keyOf(p);
      if(!colors.has(key)) colors.set(key,palette[ci++%palette.length]);
      const fill=colors.get(key);
      const x=p.x*scale, y=topH+p.y*scale, w=p.w*scale, h=p.h*scale;
      const cx=x+w/2, cy=y+h/2;
      const dim=`${Math.round(Math.min(p.w,p.h))} × ${Math.round(Math.max(p.w,p.h))}`;
      const nameSize=sizeText(p.name,Math.max(24,w-14),Math.min(30,Math.max(12,w/9)),8);
      const dimSize=sizeText(dim,Math.max(28,w-14),Math.min(27,Math.max(11,w/10)),7);
      let nameY=cy-5, dimY=cy+Math.min(24,h*.14);
      if(h<70){nameY=cy-8;dimY=cy+12}
      body+=`<g><rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${fill}" stroke="#222" stroke-width="1"/>
        <text x="${cx.toFixed(2)}" y="${nameY.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="${nameSize}px">${esc(p.name)}</text>
        <text x="${cx.toFixed(2)}" y="${dimY.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" font-size="${dimSize}px">${dim}</text></g>`;
    }

    // Boundary of the actual material used and the unused tail.
    body += `<line x1="0" y1="${usedY.toFixed(2)}" x2="${rollW.toFixed(2)}" y2="${usedY.toFixed(2)}"
                    stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>`;

    const svg=`<svg id="resultSvg" xmlns="http://www.w3.org/2000/svg" width="${pxW}" height="${pxH}" viewBox="0 0 ${pxW} ${pxH}">
      <rect width="100%" height="100%" fill="#fff"/>
      <text x="${rollW/2}" y="25" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700">${esc($('siteName').value.trim())}</text>
      <text x="${rollW/2}" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700">필름 폭 ${filmW.toLocaleString()} mm</text>
      <line x1="20" y1="58" x2="${Math.max(20,rollW-20)}" y2="58" stroke="#444"/>
      <g>${body}</g>

      <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
        <text x="${rollW+12}" y="${topH+18}" font-size="15" font-weight="700">전체 ${filmL.toLocaleString()} mm</text>
        <text x="${rollW+12}" y="${Math.min(totalY-18, usedY+18)}" font-size="15" font-weight="700" fill="#15803d">사용 ${used.toLocaleString()} mm</text>
        <text x="${rollW+12}" y="${Math.min(totalY-2, usedY+39)}" font-size="15" font-weight="700" fill="#d97706">남음 ${remain.toLocaleString()} mm</text>
        <text x="${Math.min(rollW-8, rollW/2)}" y="${Math.max(topH+30,usedY-8)}" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">재단 끝 (${used.toLocaleString()} mm)</text>
        <text x="${Math.min(rollW-8, rollW/2)}" y="${Math.min(totalY-8, usedY+26)}" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">남은 필름 ${remain.toLocaleString()} mm</text>
        <text x="${rollW/2}" y="${totalY+22}" text-anchor="middle" font-size="13" fill="#475569">필름 끝 · ${filmW.toLocaleString()} × ${filmL.toLocaleString()} mm</text>
      </g>
    </svg>`;

    $('svgHost').innerHTML=svg;
    $('svgHost').style.width=pxW+'px';
    $('svgHost').style.height=(pxH+4)+'px';
    lastResult={svg:document.getElementById('resultSvg'),used,filmW,filmL,result};
  }

  function calculate(){
    saveLocal();
    const filmW=+$('filmW').value, filmL=+$('filmL').value, items=getItems();
    if(!(filmW>0&&filmL>0)){alert('필름 폭과 길이를 입력해주세요.');return;}
    if(!items.length){alert('부재를 하나 이상 입력해주세요.');return;}
    const impossible=items.find(i=>Math.min(i.w,i.h)>filmW);
    if(impossible){alert(`필름 폭 ${filmW}mm에 들어가지 않는 부재가 있습니다: ${impossible.name} (${impossible.w}×${impossible.h})`);return;}
    const result=pack(items,filmW,filmL);
    if(!result){alert('배치 계산에 실패했습니다.');return;}
    const used=result.maxY, remain=Math.max(0,filmL-used);
    const materialArea=used*filmW;
    const partArea=result.area;
    const util=materialArea?partArea/materialArea*100:0;
    const waste=100-util;
    $('summary').textContent=`필름: ${filmW.toLocaleString()} × ${filmL.toLocaleString()} mm | 사용 길이: ${Math.ceil(used).toLocaleString()} mm | 남은 길이: ${Math.max(0,Math.floor(remain)).toLocaleString()} mm | 부재 ${items.length}개 | 최소 로스 우선 | 재단면적 활용률: ${util.toFixed(1)}% | 배치 로스: ${waste.toFixed(1)}%`;
    render(result,filmW,filmL);
    lastResult=lastResult||{};
    lastResult.items=items;
  }

  function saveCSV(){
    const rows=[...rowsEl.querySelectorAll('.row')];
    const lines=[['부재명','가로(mm)','세로(mm)','수량'].join(',')];
    rows.forEach(r=>{
      const vals=[r.querySelector('.name').value,r.querySelector('.w').value,r.querySelector('.h').value,r.querySelector('.qty').value];
      lines.push(vals.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    });
    const blob=new Blob(["\ufeff"+lines.join('\\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='필름_재단_치수내역.csv';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  async function saveJPEG(){
    if(!lastResult||!lastResult.svg){alert('먼저 재단 배치를 계산해주세요.');return;}
    const src=lastResult.svg;
    const siteName=$('siteName').value.trim() || '현장명 미입력';
    const used=lastResult.used;
    const filmW=lastResult.filmW;
    const scale=0.55;
    const topH=76;
    const rollW=filmW*scale;
    const srcW=Number(src.getAttribute('width'))||src.viewBox.baseVal.width;
    const cropH=Math.max(1,used*scale);
    const exportHeader=54;
    const outH=exportHeader+cropH;

    // JPEG는 50m 전체가 아니라 '첫 재단 시작 ~ 마지막 재단 끝'까지만 저장합니다.
    // 현장명은 이미지 상단 중앙에 별도로 표시합니다.
    const sourceGroups=[...src.children].filter(n=>n.tagName==='g');
    const filmGroup=sourceGroups.find(n=>n.querySelector('rect[stroke="#222"]'));
    if(!filmGroup){alert('JPEG 저장용 배치 정보를 만들 수 없습니다.');return;}

    const content=filmGroup.cloneNode(true);
    const outline=content.querySelector('rect[stroke="#222"]');
    if(outline){
      outline.setAttribute('y',topH);
      outline.setAttribute('height',cropH.toFixed(2));
    }
    // 원래 화면의 topH만큼 내려간 배치를 export header 아래로 옮깁니다.
    content.setAttribute('transform',`translate(0,${exportHeader-topH})`);

    // 재단 끝 표시선도 함께 가져오되 마지막 재단 위치까지만 표시합니다.
    const guideGroup=sourceGroups.find(n=>n.querySelector('line[stroke="#d97706"]'));
    let guide='';
    if(guideGroup){
      const g=guideGroup.cloneNode(true);
      g.setAttribute('transform',`translate(0,${exportHeader-topH})`);
      guide=g.outerHTML;
    }

    const summaryGroup=sourceGroups.find(n=>n.querySelector('text[fill="#15803d"]'));
    let summary='';
    if(summaryGroup){
      const g=summaryGroup.cloneNode(true);
      g.setAttribute('transform',`translate(0,${exportHeader-topH})`);
      summary=g.outerHTML;
    }

    const svgText=`<svg xmlns="http://www.w3.org/2000/svg" width="${srcW}" height="${outH}" viewBox="0 0 ${srcW} ${outH}">
      <rect width="100%" height="100%" fill="#fff"/>
      <text x="${srcW/2}" y="32" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700">${esc(siteName)}</text>
      ${content.outerHTML}
      ${guide}
      ${summary}
    </svg>`;

    const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*2));
      c.height=Math.max(1,Math.round(img.naturalHeight*2));
      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{
        if(!b){URL.revokeObjectURL(url);alert('JPEG 저장 중 오류가 발생했습니다.');return;}
        const a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download=`${siteName}_재단배치.jpg`;
        a.click();
        setTimeout(()=>{URL.revokeObjectURL(url);URL.revokeObjectURL(a.href)},1500);
      },'image/jpeg',0.95);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);alert('JPEG 변환 중 오류가 발생했습니다.');};
    img.src=url;
  }

  function clearAll(){
    if(!confirm('입력한 부재와 필름 정보를 모두 삭제할까요?'))return;
    [STORAGE_KEY,'filmTailorSavedBackup',SITE_KEY,...LEGACY_KEYS].forEach(k=>localStorage.removeItem(k));
    rowsEl.innerHTML='';$('siteName').value='';$('summary').textContent='부재를 입력하고 배치 계산을 눌러주세요.';$('svgHost').innerHTML='<div class="placeholder">계산 결과가 여기에 표시됩니다.</div>';lastResult=null;
  }

  $('addBtn').onclick=()=>addRow();
  $('saveBtn').onclick=saveCSV;
  $('calcBtn').onclick=calculate;
  $('jpegBtn').onclick=saveJPEG;
  $('clearBtn').onclick=clearAll;
  $('filmW').addEventListener('input',saveLocal);
  $('filmL').addEventListener('input',saveLocal);
  $('siteName').addEventListener('input',()=>{localStorage.setItem(SITE_KEY,$('siteName').value);saveLocal();});
  window.addEventListener('beforeunload',saveLocal);
  window.addEventListener('pagehide',saveLocal);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveLocal();});
  $('minusBtn').onclick=()=>{zoom=Math.max(.5,zoom-.1);applyZoom()};
  $('plusBtn').onclick=()=>{zoom=Math.min(2,zoom+.1);applyZoom()};
  $('fitBtn').onclick=()=>{zoom=1;applyZoom()};
  function applyZoom(){ $('zoomText').textContent=Math.round(zoom*100)+'%'; $('svgHost').style.transform=`scale(${zoom})`; $('svgHost').style.transformOrigin='top center'; }

  loadLocal();
})();
</script>
